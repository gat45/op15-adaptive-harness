[package]
name = "adaptive-harness-desktop"
version = "0.1.0"
description = "Local desktop interface for OP15 Adaptive Harness"
authors = ["gat45"]
edition = "2024"

[lib]
name = "adaptive_harness_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
op15_adaptive_harness = { package = "op15-adaptive-harness", path = "../../.." }
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

